<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transello</title>
    <link rel="stylesheet" href="popup-ui.css" />
  </head>
  <body class="aura">
    <main class="app">
      <header class="bar">
        <span class="brand"><img src="icons/icon-32.png" alt="" width="22" height="22" /><span class="word">Transello</span></span>
        <button id="engine" class="chip" type="button" data-i18n-title="optEngine"></button>
        <span class="spacer"></span>
        <button id="openWindow" class="icon-btn" type="button" data-i18n-title="openWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>
        </button>
        <button id="settings" class="icon-btn" type="button" data-i18n-title="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
        </button>
      </header>

      <div class="langs glass">
        <span class="dot a" aria-hidden="true"></span>
        <select id="source" data-i18n-title="sourceLang"></select>
        <button id="swap" class="icon-btn" type="button" data-i18n-title="swap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-4-4M17 17H4l4 4" /></svg>
        </button>
        <span class="dot b" aria-hidden="true"></span>
        <select id="target" data-i18n-title="targetLang"></select>
      </div>

      <textarea id="input" class="glass" dir="auto" spellcheck="false" data-i18n-placeholder="inputPlaceholder" data-i18n-title="inputLabel"></textarea>
      <div id="meta" class="meta" aria-live="polite"></div>

      <div class="out glass">
        <span class="beam" aria-hidden="true"></span>
        <section id="output" class="output" aria-live="polite" aria-busy="false" data-i18n-title="resultLabel">
          <div id="status" class="status"></div>
          <div id="result" class="result" dir="auto" tabindex="0"></div>
        </section>
      </div>

      <footer class="actions">
        <button id="translate" class="btn primary" type="button" data-i18n="translate"></button>
        <button id="clear" class="btn" type="button" data-i18n="clear"></button>
        <span class="spacer"></span>
        <button id="copy" class="btn" type="button" data-i18n="copyShort" data-i18n-title="copy" disabled></button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
